<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='utf-8'>
  <title>Streams Graph</title>
  <script src='https://d3js.org/d3.v7.min.js'></script>
  <style>
    html, body {{ height: 100%; margin: 0; padding: 0; overflow: hidden; background: #000; }}
    svg {{ width: 100vw; height: 100vh; display: block; background: #000; }}
    .link {{ stroke: #0f0; stroke-opacity: 1; stroke-width: 8px; }}
    .arrowhead {{ fill: #0f0; }}
    .node text {{ pointer-events: none; fill: #fff; font-weight: bold; }}
    #nodeSearchBox {{ position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 10; font-size: 5em; padding: 40px 80px; border-radius: 40px; border: 6px solid #1976d2; background: #222; color: #fff; width: 1600px; text-align: center; }}
    #copyFeedback {{ position: fixed; top: 250px; left: 50%; transform: translateX(-50%); background: #4CAF50; color: #fff; padding: 60px 120px; border-radius: 50px; font-size: 5em; z-index: 100; display: none; font-weight: bold; transition: opacity 0.3s ease; text-align: center; min-width: 1200px; }}
    #keyHelp {{ position: fixed; bottom: 20px; left: 20px; background: rgba(0,0,0,0.7); color: #fff; padding: 15px; border-radius: 10px; font-size: 1.2em; z-index: 100; }}
  </style>
</head>
<body>
<input id="nodeSearchBox" type="text" placeholder="Paste or type node name to focus..." autocomplete="off" />
<div id="copyFeedback"></div>
<div id="keyHelp">
  Keys: <strong>+/=</strong> increase edge length | <strong>-</strong> decrease edge length
</div>
<svg></svg>
<script>
const nodes = {nodes_json};
const links = {links_json};
const fontScale = {font_scale};
const alphaDecay = {alpha_decay};
const repulsion = -Math.max(window.innerWidth, window.innerHeight) * {repulsion_factor};

// FIXED: Zoom-independent base distance and user scaling
const BASE_LINK_DISTANCE = 200;
let userDistanceMultiplier = 1.0;
let currentHoverNode = null;

function copyToClipboard(text, label) {{
  function showCopyFeedback(msg) {{
    const feedbackDiv = document.getElementById('copyFeedback');
    feedbackDiv.textContent = msg;
    feedbackDiv.style.display = 'block';
    feedbackDiv.style.opacity = '1';
    setTimeout(() => {{
      feedbackDiv.style.opacity = '0';
      setTimeout(() => {{ feedbackDiv.style.display = 'none'; }}, 300);
    }}, 1200);
  }}

  if (navigator.clipboard && window.isSecureContext) {{
    navigator.clipboard.writeText(text)
      .then(() => showCopyFeedback('✓ ' + label + ' copied to clipboard'))
      .catch(() => fallbackCopy(text, label));
  }} else {{
    fallbackCopy(text, label);
  }}

  function fallbackCopy(text, label) {{
    try {{
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.left = '-9999px';
      textarea.style.top = '-9999px';
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();
      const successful = document.execCommand('copy');
      document.body.removeChild(textarea);
      if (successful) {{
        showCopyFeedback('✓ ' + label + ' copied to clipboard');
      }} else {{
        showCopyFeedback('✗ Copy failed');
      }}
    }} catch (err) {{
      console.error('Copy failed:', err);
      showCopyFeedback('✗ Copy failed');
    }}
  }}
}}

function getSize() {{
  return [window.innerWidth, window.innerHeight];
}}

function getStableLinkDistance(link) {{
  const baseDistance = BASE_LINK_DISTANCE * userDistanceMultiplier;
  const minimumDistance = 80;

  if (currentHoverNode &&
      (link.source.id === currentHoverNode.id || link.target.id === currentHoverNode.id)) {{
    return Math.max(baseDistance * 0.5, minimumDistance);
  }}

  return Math.max(baseDistance, minimumDistance);
}}

let simulation, node, link, nodeRadius;

function renderGraph() {{
  const [width, height] = getSize();
  const svg = d3.select('svg').attr('width', width).attr('height', height);
  svg.selectAll('*').remove();

  // FIXED: Smaller, more nuanced arrowheads that match edge colors
  const defs = svg.append('defs');

  // Create arrowheads for both normal (green) and hover (blue) states
  const arrowheadConfigs = [
    {{ id: 'arrowhead-green', color: '#0f0' }},
    {{ id: 'arrowhead-blue', color: '#1976d2' }}
  ];

  arrowheadConfigs.forEach(config => {{
    defs.append('marker')
        .attr('id', config.id)
        .attr('viewBox', '-0 -3 8 6')
        .attr('refX', 32)
        .attr('refY', 0)
        .attr('orient', 'auto')
        .attr('markerWidth', 8)
        .attr('markerHeight', 8)
        .attr('xoverflow', 'visible')
      .append('svg:path')
        .attr('d', 'M0,-3L8,0L0,3')
        .attr('fill', config.color);
  }});

  nodeRadius = Math.max(30, Math.min(width, height) / 18);

  simulation = d3.forceSimulation(nodes)
      .force('link', d3.forceLink(links).id(d => d.id).distance(getStableLinkDistance))
      .force('charge', d3.forceManyBody().strength(repulsion))
      .force('center', d3.forceCenter(width / 2, height / 2))
      .force('collision', d3.forceCollide().radius(nodeRadius + 5))
      .alpha(1)
      .alphaTarget(0.3)
      .alphaDecay(alphaDecay);

  link = svg.append('g')
      .selectAll('line')
      .data(links)
      .enter().append('line')
      .attr('class', 'link');

  node = svg.append('g')
      .selectAll('g')
      .data(nodes)
      .enter().append('g')
      .attr('class', 'node')
      .call(d3.drag()
          .on('start', dragstarted)
          .on('drag', dragged)
          .on('end', dragended))
      .on('mouseover', nodeMouseOver)
      .on('mouseout', nodeMouseOut);

  node.append('circle')
      .attr('r', nodeRadius)
      .attr('fill', d => d.url ? '#1f77b4' : '#333')
      .on('click', function(event, d) {{
        if (event.ctrlKey || event.metaKey) {{
          if (d.url) {{
            const filePath = d.url.replace('file://', '');
            copyToClipboard(filePath, 'Source path');
          }} else {{
            copyToClipboard('No source path available for ' + d.id, 'Message');
          }}
        }} else {{
          copyToClipboard(d.id, 'Node name');
        }}
        event.preventDefault();
        event.stopPropagation();
      }});

  node.append('text')
      .attr('x', 0)
      .attr('y', 0)
      .attr('text-anchor', 'middle')
      .style('dominant-baseline', 'middle')
      .style('font-size', (fontScale * nodeRadius) + 'px')
      .style('font-weight', 'normal')
      .text(d => d.id);

  // FIXED: Enhanced link display with differentiated incoming/outgoing edge colors
  function updateLinkDisplay() {{
    link.each(function(d) {{
      const line = d3.select(this);

      // Calculate link length and adjust endpoints
      const dx = d.target.x - d.source.x;
      const dy = d.target.y - d.source.y;
      const length = Math.sqrt(dx * dx + dy * dy);

      const sourceRadius = nodeRadius + 2;
      const targetRadius = nodeRadius + 2;
      const ux = dx / length;
      const uy = dy / length;

      const startX = d.source.x + ux * sourceRadius;
      const startY = d.source.y + uy * sourceRadius;
      const endX = d.target.x - ux * targetRadius;
      const endY = d.target.y - uy * targetRadius;

      line.attr('x1', startX)
          .attr('y1', startY)
          .attr('x2', endX)
          .attr('y2', endY);

      // FIXED: Properly handle D3.js object references for source/target
      if (currentHoverNode) {{
        // D3.js converts string refs to objects, so we need to get the id property
        const sourceId = (typeof d.source === 'object') ? d.source.id : d.source;
        const targetId = (typeof d.target === 'object') ? d.target.id : d.target;

        const isIncomingEdge = targetId === currentHoverNode.id;
        const isOutgoingEdge = sourceId === currentHoverNode.id;

        if (isIncomingEdge) {{
          // Incoming edges to focal node are blue
          line.attr('stroke', '#1976d2')
              .attr('marker-end', 'url(#arrowhead-blue)');
        }} else if (isOutgoingEdge) {{
          // Outgoing edges from focal node are green
          line.attr('stroke', '#0f0')
              .attr('marker-end', 'url(#arrowhead-green)');
        }} else {{
          // Non-connected edges (shouldn't be visible in hover mode)
          line.attr('stroke', '#0f0')
              .attr('marker-end', 'url(#arrowhead-green)');
        }}
      }} else {{
        // Default state: all edges are green
        line.attr('stroke', '#0f0')
            .attr('marker-end', 'url(#arrowhead-green)');
      }}
    }});
  }}

  simulation.on('tick', () => {{
    updateLinkDisplay();
    node.attr('transform', d => `translate(${{d.x}},${{d.y}})`);
  }});

  function dragstarted(event, d) {{
    if (!event.active) simulation.alphaTarget(0.3).restart();
    d.fx = d.x; d.fy = d.y;
  }}
  function dragged(event, d) {{
    d.fx = event.x; d.fy = event.y;
  }}
  function dragended(event, d) {{
    if (!event.active) simulation.alphaTarget(0);
    d.fx = null; d.fy = null;
  }}

  function nodeMouseOver(event, d) {{
    currentHoverNode = d;

    const connectedIds = new Set([d.id]);
    links.forEach(l => {{
      if (l.source.id === d.id) connectedIds.add(l.target.id);
      if (l.target.id === d.id) connectedIds.add(l.source.id);
    }});

    node.style('display', n => connectedIds.has(n.id) ? '' : 'none');
    link.style('display', l => (l.source.id === d.id || l.target.id === d.id) ? '' : 'none')
        .attr('stroke-width', 16);
    node.filter(n => connectedIds.has(n.id))
        .select('circle')
        .attr('fill', '#1976d2');

    d.fx = d.x;
    d.fy = d.y;

    simulation.force('link').distance(getStableLinkDistance);
    simulation.alpha(Math.min(simulation.alpha() + 0.3, 0.5));

    // Apply edge coloring immediately AND with delay
    updateLinkDisplay();
    setTimeout(updateLinkDisplay, 10);
  }}

  function nodeMouseOut(event, d) {{
    currentHoverNode = null;

    node.style('display', '');
    link.style('display', '')
        .attr('stroke-width', 8);
    node.select('circle').attr('fill', d => d.url ? '#1f77b4' : '#333');

    d.fx = null;
    d.fy = null;

    simulation.force('link').distance(getStableLinkDistance);
    simulation.alpha(Math.min(simulation.alpha() + 0.1, 0.3));

    // Apply edge coloring immediately AND with delay
    updateLinkDisplay();
    setTimeout(updateLinkDisplay, 10);
  }}

  const searchBox = document.getElementById('nodeSearchBox');
  let lastFocusedNode = null;
  searchBox.addEventListener('input', function(e) {{
    const val = searchBox.value.trim();
    if (!val) {{
      // CRITICAL FIX: Restore links properly instead of hiding them
      currentHoverNode = null;
      node.style('display', '');
      link.style('display', '')  // FIXED: was 'none', now properly restores links
          .attr('stroke-width', 8);
      node.select('circle').attr('fill', d => d.url ? '#1f77b4' : '#333');
      simulation.force('link').distance(getStableLinkDistance);
      simulation.alpha(0.3);
      if (lastFocusedNode) {{ lastFocusedNode.fx = null; lastFocusedNode.fy = null; lastFocusedNode = null; }}
      updateLinkDisplay();
      setTimeout(updateLinkDisplay, 10);
      return;
    }}

    const found = nodes.find(n => n.id === val);
    if (!found) {{
      node.style('display', 'none');
      link.style('display', 'none');
      return;
    }}

    currentHoverNode = found;
    lastFocusedNode = found;
    const connectedIds = new Set([found.id]);
    links.forEach(l => {{
      if (l.source.id === found.id) connectedIds.add(l.target.id);
      if (l.target.id === found.id) connectedIds.add(l.source.id);
    }});

    node.style('display', n => connectedIds.has(n.id) ? '' : 'none');
    link.style('display', l => (l.source.id === found.id || l.target.id === found.id) ? '' : 'none')
        .attr('stroke-width', 16);
    node.filter(n => connectedIds.has(n.id))
        .select('circle')
        .attr('fill', '#1976d2');

    found.fx = window.innerWidth / 2;
    found.fy = window.innerHeight / 2;
    simulation.force('center', null);
    simulation.force('link').distance(getStableLinkDistance);
    simulation.alpha(0.7);
    updateLinkDisplay();
    setTimeout(updateLinkDisplay, 10);
  }});
}}

window.addEventListener('resize', () => {{
  renderGraph();
  if (simulation) simulation.alpha(1);
}});

// FIXED: Stable keyboard controls
document.addEventListener('keydown', function(event) {{
  if (!simulation) return;
  if (event.target.id === 'nodeSearchBox') return;

  const adjustmentFactor = 1.2;
  let newMultiplier;

  if (event.key === '+' || event.key === '=') {{
    newMultiplier = userDistanceMultiplier * adjustmentFactor;
    userDistanceMultiplier = newMultiplier;

    simulation.force('link').distance(getStableLinkDistance);
    simulation.alpha(Math.min(simulation.alpha() + 0.1, 0.3));

    const feedbackDiv = document.getElementById('copyFeedback');
    feedbackDiv.style.background = '#FF9800';
    feedbackDiv.textContent = 'edge lengths increased (' + (userDistanceMultiplier * 100).toFixed(0) + '%)';
    feedbackDiv.style.display = 'block';
    feedbackDiv.style.opacity = '1';
    setTimeout(() => {{
      feedbackDiv.style.opacity = '0';
      setTimeout(() => {{
        feedbackDiv.style.display = 'none';
        feedbackDiv.style.background = '#4CAF50';
      }}, 300);
    }}, 800);

    event.preventDefault();
  }} else if (event.key === '-') {{
    newMultiplier = Math.max(0.3, userDistanceMultiplier / adjustmentFactor);
    userDistanceMultiplier = newMultiplier;

    simulation.force('link').distance(getStableLinkDistance);
    simulation.alpha(Math.min(simulation.alpha() + 0.1, 0.3));

    const feedbackDiv = document.getElementById('copyFeedback');
    feedbackDiv.style.background = '#FF9800';
    feedbackDiv.textContent = 'edge lengths decreased (' + (userDistanceMultiplier * 100).toFixed(0) + '%)';
    feedbackDiv.style.display = 'block';
    feedbackDiv.style.opacity = '1';
    setTimeout(() => {{
      feedbackDiv.style.opacity = '0';
      setTimeout(() => {{
        feedbackDiv.style.display = 'none';
        feedbackDiv.style.background = '#4CAF50';
      }}, 300);
    }}, 800);

    event.preventDefault();
  }}
}});

renderGraph();
</script>
</body>
</html>
