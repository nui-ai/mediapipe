[package]
name = "hand-tracking-wrappers"
description = """
    rust wrappers of the liberated original mediapipe hands pipeline, both the no-pipeline api derived from it, and the single-calculator pipeline api of it.
    this rust source tree is the initial ffi implementation for their C api of the current repository, plus mains demonstrating use of those two api over an input video file.

    this is part of the c++ repository codebase, which is a git submodule to the core repository. the actual ffi bindings used by our core repository are defined
    outside of here and do not depend on those defined here but instead have been derived-ported from them. rather, think about this source tree as a minimal api sandbox
    and proof of concept remnant of the original pipeline liberation work, which should be kept in-place for as long as this repository is a self-contained repository
    demonstrating rust usage and not merged into the core repository itself.

    BOTTOM LINE:
      • the core repository defines its own ffi bindings to the hand tracking C API which have been ported from here to it, and directly depends on the same underlying C++ and C api lib.
      • hence DO NOT add this rust source tree as a dependency in the core repository in any way, it is not necessary for the core repository and can only cause conflicts and duplication there.
"""
version = "0.1.0"
edition = "2021"

[dependencies]

# for building the opencv crate from a local fork (for debug) use e.g.:
# opencv = { path = "/home/matan/code/opencv-rust", default-features = false, features = ["imgproc","imgcodecs","highgui","videoio"] }
opencv = { version = "0.97.2", default-features = false, features = ["imgproc","imgcodecs","highgui","videoio"] }  # in support of https://github.com/nui-ai/mediapipe/issues/22

clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
libc = "0.2"

# this crate is for mediapipe interop in reading pipeline output, which is still required for now. this crate does not handle protobuf extension syntax, which we avoid needing to use by e.g. not trying to consume mediapipe pbtxt files from rust.
protobuf = "3.7.2"

[build-dependencies]
# builds rust code from the protobuf definitions of our mediapipe input and output types which we still rely on in our C API for the mediapipe pipeline.
protobuf-codegen = "3.7.2"

[[bin]]
name = "pipeline-api-runner"
path = "src/pipeline_api_runner_main.rs"

[[bin]]
name = "no-pipeline-api-runner"
path = "src/no_pipeline_api_runner_main.rs"