[package]
name = "mediapipe_hand_tracking_capi"
version = "0.1.0"
edition = "2021"
default-run = "main_new"

[dependencies]
#opencv = "0.95.0"
protobuf = "3.7.2"  # this is for mediapipe interop which is still required when using our C API for mediapipe for now. this crate does not handle protobuf extension syntax, which we avoid needing to use by e.g. not trying to consume mediapipe pbtxt files from rust.
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
libc = "0.2"
ffmpeg-next = "8.0.0"

[build-dependencies]
protobuf-codegen = "3.7.2"  # builds rust code from the protobuf definitions of our mediapipe input and output types which we still rely on in our C API.

[[bin]]
name = "main_new"
path = "src/main_new.rs"
